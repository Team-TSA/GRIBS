[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gribs"
# The release version in the PEP 440 form (PROGRAM_VERSION is "0.7.0-alpha"). The program reports PROGRAM_VERSION only; this
# value is not used in any output (ADR_A6_PACKAGE_SPLIT) and must differ from PROGRAM_VERSION as a string (tests/test_a6_output_version.py).
version = "0.7.0a0"
description = "JSON-configured solid rocket motor internal-ballistics simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "cea>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
