[pytest]
markers =
    fast: fast tests that do not launch a GRIBS subprocess or complete simulation
    integration: integration tests that launch the GRIBS CLI or initialize thermochemistry

# A-5.1-3 acceptance tests intentionally describe the corrected mass basis.
# They remain outside normal discovery until the A-5.1-4 product correction.
# Run them explicitly with:
#   pytest -q tests/red/test_a5_1_3_mass_basis_red.py
norecursedirs =
    red
